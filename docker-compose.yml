services:
  zenith:
    build: .
    image: zenith-secops:local
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      ZENITH_AUTO_SEED: "1"
      ZENITH_API_URL: "http://127.0.0.1:8000"
    volumes:
      - zenith-data:/app/data
    restart: unless-stopped

volumes:
  zenith-data:
